<!DOCTYPE html>
<html>
    <head>
        <!--bootstrao CSS-->
        <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">

<title> My Learning Progress</title>

<style>
    body{
        background-color: #f5f5f5;
    }

    .section{
        background: white;
        padding: 25px;
        margin-top:20px ;
        border-radius:10px;

    }
    .progress{
        height: 25px;
    }

</style>

    </head>
    <body>

        <div class="container">
            <div class="jumbotron text-center mt-4">

            <h1 class="display-4">
                My Learning Progress
            </h1>

            <p> Track completed course and achievements.</p>

            <button class="btn btn-primary">
                View Courses
            </button>

            <button class="btn btn-success">
                view certificates
            </button>

        </div>
        <div class="section">

            <h3>achievements</h3>

            <p> 
                HTML
                <span class="badge badge-success">
                    Completed
                </span>
            
            </p>

            <p>
                CSS 
                <span class="badge badge-info">
                    Good
                </span>
            </p>

            <p> 
                Bootstrap
                <span class="badge badge-warning">
                    Ongoing
                </span>
            </p>
            </div>

            <!--Progress Bar-->
            <div class="section">
                <h3>Course Completed</h3>
                <p>HTML</p>

                <div class="progress">

                    <div class="progress-bar bg-success"
                    style="width:90%">
                    90%
                </div>
                </div>
            </div>
        </div>
    </body>
</html>
