<!DOCTYPE html>
<html lang="en">
    <head>
        <title>bootstrap example</title>
        <meta charset="uft-8">
        <meta name="viewport" content="width device-width,initial-scale=1">
        <link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"></script>
    </head>
    <body>

        <div class="container">
            <h2>Basic progress bar</h2>
            <p>to create a default progress bar add a .progress class to a container element and add the progress bar class to its child element. use the CSS width property to set the width of progress bar:</p>
            <div class="progress">
                <div class="progress-bar" style= "width:70% ">70%</div>

            </div>
        </div>
    </body>

</html>
