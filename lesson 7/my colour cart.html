<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My colour card</title>

        <style>

            /* Universal Selector = applies to everything on the page */
            * {
                font-size: 16px;
            }

            /* Element Selectors */
            body {
                background-color: light gray;
            }

            h1 {
                color:darkblue;
            }

            h2{
                color:purple;
            }

            p{
                color:dimgray;
            }
            
            /* Class Selector */
            .my-detail {
                color : darkgreen;
                font-weight: bold;
            }

            /*ID Selector */
            #my-card {
                background-color: aqua;
            }

        </style>

    </head>
    <body>

        <h1> My Colour Card</h1>

        <!-- Inline CSS Add style="color:___;" inside this p tag-->
         <p style="color:crimson";>.Hi! this is my very own webpage.</p>

            <div id="my-card">

                <h2>About Me</h2>
                <p class="my-detail">My name is Sania</p>
                <p class="my-detail">My Favourite color is maroon</p>
                <p class="my-detail">My favourite subject is maths</p>
                <p class="my-detail">My favourite food is pasta </p>

            </div>
            <h2>My Favourite things</h2>
            <p>My Favourite animal is a cat</p>
            <p>My Favourite sport is badminton</p>
            <p>My Favourite movie is tinker bell</p>
    </body>
</html>
