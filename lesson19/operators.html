<!DOCTYPE html>
<html>

<body>

    <h2>Operator</h2>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>

    <script>
        <!--Addition-->
        //*use +, -, *,/,/operators*/
        var x = 5;
        var y = 2;
        var z = x-y;
        document.getElementById("demo").innerHTML ="x-y"+ z;
        z=x*y;
         document.getElementById("demo1").innerHTML ="x*y"+ z;
         x =10;
         z =x/y;
          document.getElementById("demo2").innerHTML ="x/y"+ z;
    </script>
</body>
</html>
